services:
  dem2tiles:
    build: .
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/merged:/app/data/merged
      - ./data/download:/app/data/download
      - ./data/processed:/app/data/processed
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    command: ["process", "--input-dir", "/app/data/raw", "--output-dir", "/app/data/processed"]

  merge-geotiffs:
    build: .
    volumes:
      - ./data/raw:/app/data/raw:ro
      - ./data/merged:/app/data/merged
      - ./scripts:/app/scripts
    entrypoint: ["python3", "scripts/merge_geotiffs.py"]
    command: ["/app/data/raw", "/app/data/merged/dem_merged.tif"]
    environment:
      - PYTHONUNBUFFERED=1

  process-chunk:
    build: .
    volumes:
      - ./data/download:/app/data/download
      - ./data/processed:/app/data/processed
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    command: ["process-chunk", "--bbox", "0,0,15,15", "--download-dir", "/app/data/download", "--output-dir", "/app/data/processed"]

  process-global:
    build: .
    volumes:
      - ./data/download:/app/data/download
      - ./data/processed:/app/data/processed
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    command: ["process-global", "--download-dir", "/app/data/download", "--output-dir", "/app/data/processed"]

  test:
    build: .
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    entrypoint: ["python3", "-m", "pytest"]
    command: ["-v", "tests/"]
