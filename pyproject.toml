[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dem-to-3dtiles"
version = "0.1.0"
description = "Convert Copernicus DEM 30M to cube-sphere terrain mesh tiles for Unity"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "rasterio>=1.3",
    "click>=8.1",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
dem2tiles = "src.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["src*"]
